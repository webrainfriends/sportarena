<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'InterBlack';src:url('fonts/Inter_900_Italic.woff2') format('woff2');}
html,body{margin:0;background:transparent}
svg{display:block}
text{font-family:'InterBlack';font-weight:900;font-style:italic}
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620">
<defs>
 <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7B2FF0" stop-opacity="0"/>
  <stop offset=".25" stop-color="#7B2FF0"/>
  <stop offset="1" stop-color="#4A12A8"/>
 </linearGradient>
</defs>
<g id="root"></g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const root=document.getElementById('root');
const SIZE=260, X0=60, BASE=280;

// Flat coloured text — no extrusion
const mkFlat=(txt,x,fill,parent)=>{
  const g=el('g',{transform:`translate(${x},${BASE})`},parent);
  const t=el('text',{x:0,y:0,'font-size':SIZE,'letter-spacing':-4,fill},g);
  t.textContent=txt;
  return g;
};

window.build=async(variant,mode='full')=>{
  await document.fonts.load(`900 300px InterBlack`);
  root.innerHTML='';

  const measure=(txt)=>{
    const p=el('text',{'font-size':SIZE,'letter-spacing':-4,x:0,y:-9999},root);
    p.textContent=txt;
    const w=p.getComputedTextLength();
    p.remove();
    return w;
  };

  const w1=measure('GotMy');
  const wG=measure('G');
  const w3=measure('ame');

  // "GotMy" — purple #7B33C4
  mkFlat('GotMy', X0, '#7B33C4', root);

  // Flame swoosh above the G: a smooth teardrop arc in amber/gold drawn BEFORE the G text
  // so it sits behind the letter stroke but visually in front of "GotMy"
  const gx = X0 + w1;
  // The cap-top of the font sits at roughly BASE - SIZE*0.74 for Inter
  const cap = BASE - SIZE * 0.74;
  // Flame: starts at the left shoulder of G, curves up and over, tapers to a point
  const fx = gx + wG * 0.08;   // left anchor near the G's top-left
  const fy = cap + SIZE * 0.06; // just below cap height
  const tipX = gx + wG * 1.08; // tip extends slightly past the G's right edge
  const tipY = cap - SIZE * 0.26; // tip points above cap height
  el('path',{
    d:`M ${fx} ${fy}
       C ${fx + wG*0.3}  ${cap - SIZE*0.08},
         ${tipX - wG*0.35} ${tipY + SIZE*0.04},
         ${tipX} ${tipY}
       C ${tipX - wG*0.1} ${tipY + SIZE*0.18},
         ${fx + wG*1.1}  ${cap + SIZE*0.12},
         ${fx + wG*0.82} ${fy + SIZE*0.04}
       C ${fx + wG*0.55} ${fy + SIZE*0.08},
         ${fx + wG*0.2}  ${fy + SIZE*0.05},
         ${fx} ${fy} Z`,
    fill:'#F5A820', stroke:'none'
  }, root);

  // "G" in amber/gold #F5A820, drawn on top of the flame
  mkFlat('G', gx, '#F5A820', root);

  // "ame" — deep indigo #3535B8
  mkFlat('ame', gx + wG, '#3535B8', root);

  const right = gx + wG + w3;
  const total = right - X0, cx = (X0 + right) / 2;
  if(mode==='name') return {right, tw:0};

  // Tagline swoosh decoration
  el('path',{
    d:`M ${X0-30} ${BASE+140} C ${X0+200} ${BASE+78}, ${X0+500} ${BASE+52}, ${X0+w1*0.9} ${BASE+52} C ${X0+w1*0.55} ${BASE+78}, ${X0+240} ${BASE+114}, ${X0-30} ${BASE+140} Z`,
    fill:'url(#swoosh)'
  }, root);

  const tag='THE SPORTSVERSE', tsize=58, ty=BASE+218;
  const navy=variant==='dark'?'#F2F4FA':'#1B1D3A';
  const tt=el('text',{x:0,y:0,'font-size':tsize,'letter-spacing':tsize*0.24,fill:navy},root);
  let html='';
  [...tag].forEach((ch,i)=>{ html += (i===11)?`<tspan fill="#8A3FF0">${ch}</tspan>`:ch; });
  tt.innerHTML=html;
  const nat=tt.getComputedTextLength(), target=total*0.60, ts=target/nat;
  tt.setAttribute('transform',`translate(${cx-target/2},${ty}) scale(${ts},1)`);
  const lw=total*0.11, gap=24, ly=ty-tsize*0.34;
  const line=(x,w)=>el('rect',{x:0,y:0,width:w,height:4,fill:'#7B2FF0',transform:`translate(${x},${ly}) skewX(-18)`},root);
  line(cx-target/2-gap-lw, lw);
  line(cx+target/2+gap, lw);
  return {right, tw:target};
};
</script></body></html>
