# Deploys SportArena to its EC2 host over SSH with the sportarena.pem deploy key (repo secret EC2_SSH_KEY).
#
# It runs side by side with the apps already on the box and never touches them:
#   - nginx:    its own site file (sites-available/sportarena) on NGINX_PORT (plain HTTP for now; set
#               ENABLE_TLS to "true" for HTTPS). Validated with `nginx -t`
#               before a graceful reload; on any error our site is removed and the other sites keep serving.
#   - API:      pm2 process "sportarena-api" on APP_PORT (reached only through nginx; keep it closed in the SG).
#   - Postgres: Docker container "sportarena-postgres" (postgres:16-alpine) on 127.0.0.1:DB_PORT, volume
#               sportarena_pgdata. Never recreated or wiped by a deploy.
#   - Web:      Expo web build published to /var/www/sportarena-web, served by the same nginx site.
#   - Keys:     the field-encryption master key is generated once, wrapped by AWS KMS (KMS_KEY_ID, via the
#               instance role) and stored only in wrapped form. The app refuses to start without KMS access.
#
# One-time setup (see docs/deployment.md):
#   1. Repo secrets (Settings -> Secrets and variables -> Actions):
#        EC2_SSH_KEY  - the sportarena.pem private key (whole file, incl. BEGIN/END lines)
#        KMS_KEY_ID   - KMS key (ARN, id or alias) the instance role may GenerateDataKey/Decrypt with
#   2. Security group: allow inbound TCP 9255. Do NOT open 7255 (DB) or 4255 (API) - both are for localhost.
#   3. Merging to main deploys automatically; you can also run "Deploy to EC2" from the Actions tab.
#      (The manual button only appears once main is the repository's DEFAULT branch - Settings -> General.
#      The push trigger works regardless.)

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EC2_HOST: ec2-13-250-133-109.ap-southeast-1.compute.amazonaws.com
  EC2_USER: ubuntu
  AWS_REGION: ap-southeast-1
  APP_DIR: sportarena
  APP_PORT: 4255      # API, reached only through nginx
  NGINX_PORT: 9255    # public
  # INTERIM: plain HTTP. Personal data is NOT encrypted in transit until this is "true" (self-signed cert) or a
  # real certificate/domain is set up. Flip to "true" and redeploy to get HTTPS on the same port.
  ENABLE_TLS: "false"
  DB_PORT: 7255       # Postgres container, bound to 127.0.0.1
  PUBLIC_IP: 13.250.133.109

permissions:
  contents: read

concurrency:
  group: deploy-sportarena-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}

    steps:
      - name: Check SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Fails fast with a readable reason if the secret is not a usable private key, and prints the
          # PUBLIC fingerprint so it can be compared with the key authorised on the instance
          # (`ssh-keygen -lf ~/.ssh/authorized_keys` there). No secret material is printed.
          if [ -z "${EC2_SSH_KEY:-}" ]; then echo "::error::EC2_SSH_KEY secret is empty"; exit 1; fi
          KEYFILE="$(mktemp)"; trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$KEYFILE"; chmod 600 "$KEYFILE"
          head -1 "$KEYFILE" | grep -q -- '-----BEGIN .*PRIVATE KEY-----' \
            || { echo "::error::EC2_SSH_KEY must start with a '-----BEGIN ... PRIVATE KEY-----' line (paste the whole .pem, not a .ppk or the public key)"; exit 1; }
          tail -1 "$KEYFILE" | grep -q -- '-----END .*PRIVATE KEY-----' \
            || { echo "::error::EC2_SSH_KEY is missing its '-----END ... PRIVATE KEY-----' line (truncated paste?)"; exit 1; }
          PUB="$(ssh-keygen -y -P '' -f "$KEYFILE" 2>/dev/null)" \
            || { echo "::error::EC2_SSH_KEY could not be parsed (corrupted line breaks, or the key has a passphrase)"; exit 1; }
          echo "Key OK. Public fingerprint (compare with the instance's authorized_keys):"
          printf '%s\n' "$PUB" | ssh-keygen -lf -
          echo "Connecting as ${{ env.EC2_USER }}@${{ env.EC2_HOST }}"

      - name: AWS secrets check
        env:
          K_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          K_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Reports presence only (never values), so a missing/misplaced secret is obvious from the log.
          [ -n "$K_ID" ] && echo "AWS_ACCESS_KEY_ID: set" || echo "AWS_ACCESS_KEY_ID: MISSING"
          [ -n "$K_SECRET" ] && echo "AWS_SECRET_ACCESS_KEY: set" || echo "AWS_SECRET_ACCESS_KEY: MISSING"
          # Shape checks (length / line count / prefix only - never the values).
          if [ -n "$K_ID" ]; then
            if printf '%s' "$K_ID" | grep -Eq '^(AKIA|ASIA)[A-Z0-9]{16}$'; then echo "AWS_ACCESS_KEY_ID shape: OK (20 chars)"
            else echo "::error::AWS_ACCESS_KEY_ID looks wrong: expected 20 chars starting AKIA (got ${#K_ID} chars, $(printf '%s\n' "$K_ID" | wc -l) line(s)); check for stray spaces/quotes or a pasted '=' prefix"; BAD=1; fi
          fi
          if [ -n "$K_SECRET" ]; then
            LINES=$(printf '%s\n' "$K_SECRET" | wc -l)
            if [ "$LINES" -gt 1 ]; then echo "::error::AWS_SECRET_ACCESS_KEY has $LINES lines - an AWS secret key is ONE line of 40 characters. It looks like a .pem/private key was pasted here by mistake. Paste the secret access key that pairs with AWS_ACCESS_KEY_ID (IAM > Users > Security credentials > Create access key)."; BAD=1
            elif ! printf '%s' "$K_SECRET" | grep -Eq '^[A-Za-z0-9/+=]{40}$'; then echo "::error::AWS_SECRET_ACCESS_KEY looks wrong: expected 40 characters [A-Za-z0-9/+=] (got ${#K_SECRET}); check for stray spaces/quotes"; BAD=1
            else echo "AWS_SECRET_ACCESS_KEY shape: OK (40 chars)"; fi
          fi
          [ "${BAD:-0}" = "1" ] && echo "Fix the secret(s) above, then re-run; the AWS-based key authorisation is skipped/failing until they are valid." || true
          echo "Both must exist as Repository secrets (Settings > Secrets and variables > Actions > Repository secrets) or as secrets of the 'production' environment, with exactly these names."

      # ---- SSH access: the deploy key must be authorised on the instance. If it isn't, install it through AWS
      # EC2 Instance Connect (needs the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repo secrets - the same ones the
      # IAM user with ec2:DescribeInstances + ec2-instance-connect:SendSSHPublicKey). No one has to log in to the server.
      - name: Test SSH access
        id: ssh_test
        continue-on-error: true
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          KEYFILE="$(mktemp)"; trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$KEYFILE"; chmod 600 "$KEYFILE"
          ssh -i "$KEYFILE" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" 'echo "ssh ok as $(whoami)"'

      - name: AWS credentials (for EC2 Instance Connect)
        if: steps.ssh_test.outcome == 'failure' && env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authorize deploy key on the instance
        if: steps.ssh_test.outcome == 'failure' && env.HAS_AWS_KEYS == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          KEYFILE="$(mktemp)"; trap 'rm -f "$KEYFILE" "$KEYFILE.pub"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$KEYFILE"; chmod 600 "$KEYFILE"
          PUB="$(ssh-keygen -y -P '' -f "$KEYFILE")"
          read -r INSTANCE_ID AZ < <(aws ec2 describe-instances --filters "Name=ip-address,Values=${{ env.PUBLIC_IP }}" \
            --query 'Reservations[].Instances[].[InstanceId,Placement.AvailabilityZone]' --output text | head -1) \
            || { echo "::error::Could not look up the instance (the AWS keys need ec2:DescribeInstances)."; exit 1; }
          [ -n "${INSTANCE_ID:-}" ] || { echo "::error::No EC2 instance with public IP ${{ env.PUBLIC_IP }} found in ${{ env.AWS_REGION }}."; exit 1; }
          echo "Instance $INSTANCE_ID in $AZ - pushing the deploy public key with EC2 Instance Connect (valid 60s)"
          printf '%s\n' "$PUB" > "$KEYFILE.pub"
          aws ec2-instance-connect send-ssh-public-key --instance-id "$INSTANCE_ID" --availability-zone "$AZ" \
            --instance-os-user "${{ env.EC2_USER }}" --ssh-public-key "file://$KEYFILE.pub" >/dev/null \
            || { echo "::error::EC2 Instance Connect refused. The AWS keys need ec2-instance-connect:SendSSHPublicKey on this instance, and the instance needs the ec2-instance-connect package (default on Ubuntu AMIs)."; exit 1; }
          # make it permanent so later runs (and the deploy step) connect normally
          printf '%s\n' "$PUB" | ssh -i "$KEYFILE" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'umask 077; mkdir -p ~/.ssh; touch ~/.ssh/authorized_keys; read -r k; grep -qxF "$k" ~/.ssh/authorized_keys || printf "%s\n" "$k" >> ~/.ssh/authorized_keys; echo "deploy key authorised"'
          ssh -i "$KEYFILE" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" 'echo "verified: ssh now works as $(whoami)"'

      - name: Stop if SSH is still not possible
        if: steps.ssh_test.outcome == 'failure' && env.HAS_AWS_KEYS != 'true'
        run: |
          echo "::error::The server does not accept EC2_SSH_KEY for ${{ env.EC2_USER }}@${{ env.EC2_HOST }}, and no AWS keys are configured to authorise it automatically."
          echo "Fix (no server login needed): add repo secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for an IAM user allowed ec2:DescribeInstances and ec2-instance-connect:SendSSHPublicKey, then re-run (see the 'AWS secrets check' step above for which one is missing)."
          echo "The workflow then installs this key on the instance itself."
          echo "sportarena.pem's public key must be in ~ubuntu/.ssh/authorized_keys on the instance; with the AWS keys present this workflow adds it."
          exit 1

      - uses: actions/checkout@v4

      # The deploy script lives in the repo (scripts/deploy-remote.sh) and is copied to the host and run with plain
      # ssh, so its output streams live and its exit status is real (a pasted multi-line action script lost its
      # final lines/errors on failure).
      - name: Deploy over SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          BRANCH: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          PUBLIC_HOST: ec2-13-250-133-109.ap-southeast-1.compute.amazonaws.com
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          KMS_REGION: ap-southeast-1
          # optional payment providers: a provider is switched on when its keys exist (see docs/payments.md)
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          PAYPAL_ENV: ${{ vars.PAYPAL_ENV }}
          PAYMENT_CURRENCY: ${{ vars.PAYMENT_CURRENCY }}
          # optional: raises Expo push limits / enables enhanced security for phone push (https://expo.dev/accounts/_/settings/access-tokens)
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          # platform owner account (see docs/partners.md): created on first start; the password is a repo secret and never stored in git
          PLATFORM_ADMIN_EMAIL: ${{ vars.PLATFORM_ADMIN_EMAIL || 'platform@sportarena.com' }}
          PLATFORM_ADMIN_HANDLE: ${{ vars.PLATFORM_ADMIN_HANDLE || 'platformarena' }}
          PLATFORM_ADMIN_NAME: ${{ vars.PLATFORM_ADMIN_NAME || 'PlatformArena' }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYFILE="$(mktemp)"; trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$KEYFILE"; chmod 600 "$KEYFILE"
          SSH_OPTS=(-i "$KEYFILE" -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null)
          TARGET="${EC2_USER}@${EC2_HOST}"
          scp "${SSH_OPTS[@]}" scripts/deploy-remote.sh "$TARGET:/tmp/sportarena-deploy.sh"
          REMOTE_ENV=""
          for v in APP_DIR BRANCH REPO_URL APP_PORT NGINX_PORT DB_PORT ENABLE_TLS PUBLIC_HOST PUBLIC_IP KMS_KEY_ID KMS_REGION STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET PAYPAL_WEBHOOK_ID PAYPAL_ENV PAYMENT_CURRENCY EXPO_ACCESS_TOKEN PLATFORM_ADMIN_EMAIL PLATFORM_ADMIN_HANDLE PLATFORM_ADMIN_NAME PLATFORM_ADMIN_PASSWORD; do
            REMOTE_ENV+="$(printf '%s=%q ' "$v" "${!v:-}")"
          done
          timeout 20m ssh -T "${SSH_OPTS[@]}" "$TARGET" "env $REMOTE_ENV bash /tmp/sportarena-deploy.sh"

      # ---- Visibility without anyone logging in: the runner SSHes in and prints the server state into this log,
      # so problems can be diagnosed from the run logs alone. Never prints .env or any secret.
      - name: Server report
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "== listeners on 9255/4255/7255"; sudo ss -ltnp 2>/dev/null | grep -E ':(9255|4255|7255)\b' || echo "nothing listening"
            echo "== nginx sites enabled"; ls -1 /etc/nginx/sites-enabled 2>&1; sudo nginx -t 2>&1 | tail -2
            echo "== pm2"; pm2 ls 2>&1 | head -20
            echo "== docker (sportarena)"; sudo docker ps -a --filter name=sportarena --format '{{.Names}} | {{.Status}} | {{.Ports}}' 2>&1
            echo "== host firewall"; sudo ufw status 2>&1 | head -12
            echo "== local health"; curl -s -m 5 http://127.0.0.1:4255/health || echo "api: no answer"; echo
            curl -s -m 5 -o /dev/null -w "nginx 9255 -> HTTP %{http_code}\n" http://127.0.0.1:9255/health || echo "nginx: no answer"
            echo "== api log (last 25 lines)"; pm2 logs sportarena-api --lines 25 --nostream 2>&1 | tail -30
            echo "== master key file"; ls -l /var/lib/sportarena 2>&1
            echo "== last deploy error"; cat /tmp/sportarena-deploy-error.log 2>&1 || true
            echo "== nginx error"; cat /tmp/sportarena-nginx-error.log 2>&1 || true
            echo "== rejected nginx site"; cat /tmp/sportarena-site.rejected 2>&1 || true

      # Reachability from the public internet (tells a closed security group apart from a stopped service).
      - name: Public reachability probe
        if: always()
        continue-on-error: true
        run: |
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' "http://${{ env.PUBLIC_IP }}:${{ env.NGINX_PORT }}/health" || true)
          echo "GET http://${{ env.PUBLIC_IP }}:${{ env.NGINX_PORT }}/health from the internet -> HTTP ${code:-000}"
          [ "$code" = "200" ] && echo "REACHABLE" || echo "NOT reachable (000 with a timeout usually means the security group blocks ${{ env.NGINX_PORT }}; connection refused means nothing listens)"
          echo "web app  GET /            -> HTTP $(curl -s -m 10 -o /dev/null -w '%{http_code}' "http://${{ env.PUBLIC_IP }}:${{ env.NGINX_PORT }}/" || true)"
          echo "api      GET /api/v1/sports -> HTTP $(curl -s -m 10 -o /dev/null -w '%{http_code}' "http://${{ env.PUBLIC_IP }}:${{ env.NGINX_PORT }}/api/v1/sports" || true)"
