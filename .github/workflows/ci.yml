name: CI

on:
  # PRs only: merging to main is deployed by deploy.yml, which doesn't need a second identical CI run.
  pull_request:
    branches: [main]
  workflow_dispatch:   # run/build manually from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests + deploy script syntax
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportarena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sportarena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: bash -n scripts/deploy-remote.sh
      - run: npm ci
      # tender-extras reads the generated PDFs back as text with pdftotext
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: npm test
        shell: bash   # explicit bash runs with -eo pipefail, so a failing npm test still fails the step through tee
        run: npm test 2>&1 | tee test.log
      # the Postgres service log is appended after the test output, so the failing tests are listed here where they are easy to find
      - name: Failing tests
        if: failure()
        run: |
          grep -nE '^# (tests|pass|fail) ' test.log || true
          grep -nE -A30 '^not ok' test.log | head -300 || true

  app-web:
    name: App web build (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo export --platform web
        working-directory: apps/app
