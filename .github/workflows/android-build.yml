name: Android build

# Manual only: the maintainer starts Android builds from the Actions tab. The runner only queues the build on EAS (it never touches the server or the
# database). Needs the repo secret EXPO_TOKEN (expo.dev access token), the same one the iOS build uses. EAS creates and keeps the Android signing
# keystore on expo.dev the first time a build runs. Submitting to Google Play is not wired up yet (it needs a Play service-account key).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (preview builds an installable .apk; production builds a Play .aab)
        type: choice
        options: [preview, production, development]
        default: preview

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build (queued on EAS)
        working-directory: apps/app
        env:
          PROFILE: ${{ inputs.profile }}
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
